name: Build Example
on:
 push:
  branches:
   - main

jobs:
 build:
  runs-on: ubuntu-latest
  steps:
   - name: Checkout
     uses: actions/checkout@v2

   - name: Setup Node.js environment
     uses: actions/setup-node@v4.4.0

   - name: Install dependencies
     run: npm install

   - name: Verification
     run: ls -alhR

   - name: Zip
     uses: actions/upload-artifact@v4
     with: 
      name: Zipfile
      path: |
        app.js
        node_modules

      