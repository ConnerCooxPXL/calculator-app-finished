name: Complete Example
on:
 push:
  branches:
   - main

jobs:
 build:
  runs-on: ubuntu-latest
  steps:
   - name: Checkout
     uses: actions/checkout@v2

   - name: Setup Node.js environment
     uses: actions/setup-node@v4.4.0

   - name: Install dependencies
     run: npm install

   - name: Verification
     run: ls -alhR


   - name: Zip
     uses: actions/upload-artifact@v4
     with: 
      name: Zipfile
      path: |
        app.js
        node_modules

   - name: unittests
     run: npm test -- --coverage

   - name: Coverage Rapport
     uses: mridang/action-test-reporter@v1.7.0
     with:
      github-token: ${{ secrets.GITHUB_TOKEN }}
      coverage-file: ./coverage/clover.xml
      working-directory: ./

   - name: Setup docker environment
     uses: actions/setup-docker@v4.4.0

   - name: Login to DockerHub
     uses: docker/login-action@v3
     with:
      username: conncoox3
      password: ${{ secrets.DOCKERHUB_TOKEN }}

   - name: Set up Docker Buildx
     uses: docker/setup-buildx-action@v3

   - name: Build Docker image
     run: |
      docker build -t conncoox3/calculator-app:latest .

   - name: Push Docker image to DockerHub
     run: |
      docker push conncoox3/calculator-app:latest
